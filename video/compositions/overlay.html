  <script>
    const tl = gsap.timeline({ paused: true });
    const ease = "power3.out";
    const root = document.querySelector('[data-composition-id="overlay"]');
    const span = (el) => [+el.dataset.start, +el.dataset.duration];
    // Intro: scrim, then the challenge, the question (said by the voice) and the place.

    tl.fromTo("#intro-place", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease }, 1.2);
    tl.to("#intro", { opacity: 0, duration: 0.3, ease: "power1.in" }, 3.3);
    // Captions rise in and fade out just before their end; timing comes from each element's own attributes.
    root.querySelectorAll(".cap").forEach((el) => {
      const [s, d] = span(el);
      tl.fromTo(el.firstElementChild, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.25, ease }, s);
      tl.to(el.firstElementChild, { opacity: 0, duration: 0.18, ease: "power1.in" }, s + d - 0.2);
    });
    root.querySelectorAll(".ring").forEach((el) => {
      const [s, d] = span(el);
      tl.fromTo(el.firstElementChild, { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.3, ease }, s);
      tl.to(el.firstElementChild, { opacity: 0, duration: 0.18 }, s + d - 0.2);
    });
    root.querySelectorAll(".pulse").forEach((el) => {
      const [s, d] = span(el);
      tl.fromTo(el.firstElementChild, { scale: 0.35, opacity: 1 }, { scale: 1.5, opacity: 0, duration: Math.min(0.75, d - 0.05), ease: "power2.out" }, s);
    });
    // End card: the band wipes up as the voice says "EarthScope", the tagline lands on "find the signal".
    const end = +document.getElementById("endcard").dataset.start;

    tl.fromTo("#end-logo", { opacity: 0 }, { opacity: 1, duration: 0.3 }, end + 0.15);
    tl.fromTo("#end-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease }, end + 0.15);
